name: Campaign localization tests

on:
  push:
    paths:
      - 'src/**'
      - 'ext/**'
      - 'tests/**'
      - '.github/workflows/campaign-localization.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'ext/**'
      - 'tests/**'
      - '.github/workflows/campaign-localization.yml'

permissions:
  contents: read

jobs:
  localization:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
        configuration: [Debug, Release]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Configure metadata tests
        run: cmake -S tests/campaign_localization -B build-metadata-tests -DCMAKE_BUILD_TYPE=${{ matrix.configuration }}
      - name: Build metadata tests
        run: cmake --build build-metadata-tests --config ${{ matrix.configuration }}
      - name: Run metadata tests
        run: ctest --test-dir build-metadata-tests -C ${{ matrix.configuration }} --output-on-failure
      - name: Configure message tests
        run: cmake -S tests/custom_messages_localization -B build-message-tests -DCMAKE_BUILD_TYPE=${{ matrix.configuration }}
      - name: Build message tests
        run: cmake --build build-message-tests --config ${{ matrix.configuration }}
      - name: Run message tests
        run: ctest --test-dir build-message-tests -C ${{ matrix.configuration }} --output-on-failure
